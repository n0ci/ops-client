# Everything an agent needs to find the systems. No secrets.
owner: n0ci
repositories:
  - name: platform          # this repo: desired inputs, runbooks
  - name: platform-control  # owner-only executor (read/dispatch only)
  - name: ops-client        # public CLI + bootstrap
  - name: abfahrt-backend
  - name: abfahrt-app
  - name: imoutfyi
apps:
  abfahrt:
    repos: [abfahrt-backend, abfahrt-app]
    host: abfahrt-db          # OCI A1 3 OCPU / 18 GB, eu-frankfurt-1, root compartment
    url: https://abfahrt.app
    api: https://api.abfahrt.app/v1/health/ready
    deploy: promoted-release  # host polls the `promoted` GitHub release every 5 min
  imoutfyi:
    repos: [imoutfyi]
    host: imout-app           # OCI A1 1 OCPU / 6 GB, compartment imout
    url: https://imout.fyi
    deploy: release-on-main   # build on push to main, digest deploy via Cloudflare Access SSH
stacks:
  abfahrt:
    state: abfahrt/terraform.tfstate
    inputs: stacks/abfahrt/inputs.tfvars.json
providers:
  oci: {tenancy: fabionocera97, region: eu-frankfurt-1, state_bucket: ops-terraform-state}
  cloudflare: {zones: [abfahrt.app, imout.fyi, nocera.dev]}
